<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Style – Mistral API</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      background:#050509;
      color:#f5f5f7;
      display:flex;
      flex-direction:column;
      height:100vh;
    }
    header{
      padding:12px 16px;
      border-bottom:1px solid #222;
      text-align:center;
      font-size:15px;
      color:#a1a1a6;
    }
    .chat-container{
      flex:1;
      overflow-y:auto;
      padding:16px;
      background:#111118;
    }
    .message{
      max-width:70%;
      padding:10px 14px;
      border-radius:14px;
      margin-bottom:10px;
      line-height:1.6;
      font-size:14px;
      white-space:pre-wrap;
    }
    .message.user{
      margin-left:auto;
      background:#0b93f6;
      color:#fff;
      border-bottom-right-radius:4px;
    }
    .message.ai{
      margin-right:auto;
      background:#1f1f28;
      border-bottom-left-radius:4px;
    }
    .message.system{
      text-align:center;
      margin:10px auto;
      font-size:12px;
      color:#a1a1a6;
      background:transparent;
    }
    .input-bar{
      display:flex;
      gap:8px;
      padding:10px;
      border-top:1px solid #222;
      background:#050509;
    }
    .input-bar textarea{
      flex:1;
      resize:none;
      padding:10px;
      border-radius:10px;
      border:1px solid #333;
      background:#0c0c12;
      color:#fff;
      font-size:14px;
      max-height:120px;
    }
    .input-bar button{
      padding:0 18px;
      border-radius:10px;
      border:none;
      background:#0b93f6;
      color:#fff;
      font-size:14px;
      cursor:pointer;
    }
    .input-bar button:disabled{
      opacity:.5;
      cursor:default;
    }
  </style>
</head>
<body>

  <header>محادثة Mistral API</header>

  <main id="chat" class="chat-container">
    <div class="message system">ابدأ بكتابة سؤالك…</div>
  </main>

  <div class="input-bar">
    <textarea id="input" rows="1" placeholder="اكتب هنا..."></textarea>
    <button id="sendBtn">إرسال</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');

    // 🔑 مفتاح Mistral API (ضع مفتاحك هنا)
    const MISTRAL_API_KEY = "fkU26zoB0QlbqfaV79jKfm098kO4EJcy";

    function addMessage(text, type){
      const div = document.createElement('div');
      div.className = 'message ' + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendToMistral(userText){
      const url = "https://api.mistral.ai/v1/chat/completions";

      const body = {
        model: "mistral-large-latest",
        messages: [
          { role: "user", content: userText }
        ]
      };

      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + MISTRAL_API_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      return data.choices[0].message.content;
    }

    async function send(){
      const text = input.value.trim();
      if(!text) return;

      addMessage(text, 'user');
      input.value = '';
      sendBtn.disabled = true;

      try {
        const reply = await sendToMistral(text);
        addMessage(reply, 'ai');
      } catch (e) {
        addMessage("⚠️ حدث خطأ أثناء الاتصال بـ Mistral", "ai");
      }

      sendBtn.disabled = false;
    }

    sendBtn.onclick = send;

    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        send();
      }
    });
  </script>

</body>
</html>
