<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AI Code Workspace – ChatGPT Style</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        :root {
            --bg-main:#0d0d0f;--bg-elevated:#1c1c1e;--bg-elevated-2:#2c2c2e;
            --border-subtle:#2c2c2e;--accent:#007aff;--accent-soft:#0a84ff;
            --text-main:#f5f5f7;--text-muted:#a1a1a6;--danger:#ff3b30;--success:#34c759;
        }
        *{box-sizing:border-box}
        body{
            font-family:'SF Pro Display',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
            background:var(--bg-main);color:var(--text-main);margin:0;padding:0;overflow:hidden;
        }
        .top-new-chat{
            position:fixed;top:15px;left:15px;background:var(--bg-elevated);
            padding:10px 16px;border-radius:10px;cursor:pointer;font-size:15px;
            border:1px solid var(--border-subtle);transition:.2s;z-index:50;
            display:flex;align-items:center;gap:6px;
        }
        .top-new-chat:hover{background:var(--bg-elevated-2)}
        .floating-btn{
            position:fixed;bottom:20px;width:48px;height:48px;background:var(--bg-elevated);
            border-radius:50%;display:flex;align-items:center;justify-content:center;
            font-size:22px;cursor:pointer;border:1px solid var(--border-subtle);
            transition:.2s;z-index:50;
        }
        .floating-btn:hover{background:var(--bg-elevated-2)}
        .floating-btn.left{left:20px}
        .floating-btn.right{right:20px}
        .page{display:none;height:100vh;width:100vw}
        .page.active{display:block}
        .chat-container{
            height:calc(100vh - 70px);overflow-y:auto;padding:20px;padding-bottom:100px;
        }
        .message{
            max-width:70%;padding:12px 16px;border-radius:14px;margin-bottom:12px;
            line-height:1.6;font-size:15px;white-space:pre-wrap;
        }
        .message.user{
            background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:4px;
        }
        .message.ai{
            background:var(--bg-elevated);border:1px solid var(--border-subtle);
            color:var(--text-main);margin-right:auto;border-bottom-left-radius:4px;
        }
        .message.system{
            background:transparent;color:var(--text-muted);margin:10px auto;
            text-align:center;font-size:13px;
        }
        .chat-input-bar{
            position:fixed;bottom:0;width:100%;background:var(--bg-main);
            padding:12px;border-top:1px solid var(--border-subtle);display:flex;gap:10px;
        }
        .chat-input-bar input{
            flex:1;padding:12px;border-radius:10px;border:1px solid var(--border-subtle);
            background:var(--bg-elevated);color:#fff;font-size:15px;
        }
        .chat-input-bar button{
            padding:12px 20px;background:var(--accent);border:none;border-radius:10px;
            color:#fff;cursor:pointer;font-size:15px;
        }
        .chat-input-bar button:hover{background:var(--accent-soft)}
        .sidebar{
            position:fixed;top:0;width:360px;height:100vh;background:var(--bg-elevated);
            border-left:1px solid var(--border-subtle);border-right:1px solid var(--border-subtle);
            z-index:100;transform:translateX(-100%);transition:.3s ease;overflow-y:auto;padding-bottom:40px;
        }
        .sidebar.right{right:0;transform:translateX(100%)}
        .sidebar.active.left{transform:translateX(0)}
        .sidebar.active.right{transform:translateX(0)}
        .sidebar-header{
            display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid var(--border-subtle);
            align-items:center;
        }
        .sidebar-header h3{margin:0;font-size:16px}
        .sidebar-header button{
            background:none;border:none;color:var(--text-main);font-size:20px;cursor:pointer;
        }
        .files-list{padding:15px}
        .file-item{
            padding:10px;background:var(--bg-elevated-2);border-radius:8px;margin-bottom:8px;
            cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;
        }
        .file-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .file-item small{color:var(--text-muted);font-size:11px}
        .file-item.active{border:1px solid var(--accent)}
        .file-item:hover{background:#3a3a3c}
        .file-actions{
            padding:15px;border-top:1px solid var(--border-subtle);
            display:flex;flex-direction:column;gap:8px;
        }
        .file-actions button{
            padding:8px;border-radius:8px;border:none;background:var(--bg-elevated-2);
            color:var(--text-main);cursor:pointer;font-size:13px;
        }
        .file-actions button:hover{background:#3a3a3c}
        .file-editor{
            padding:15px;background:var(--bg-main);border-top:1px solid var(--border-subtle);
        }
        .file-editor pre{
            background:var(--bg-elevated)!important;padding:15px;border-radius:10px;
            overflow-x:auto;max-height:260px;
        }
        .file-editor-actions{
            padding:15px;display:flex;gap:10px;
        }
        .file-editor-actions button{
            flex:1;padding:10px;background:var(--bg-elevated-2);border:none;border-radius:8px;
            color:#fff;cursor:pointer;font-size:13px;
        }
        .file-editor-actions button:hover{background:#3a3a3c}
        .settings-content{
            padding:20px;display:flex;flex-direction:column;gap:15px;font-size:14px;
        }
        .settings-content label{font-size:13px;opacity:.8}
        .settings-content select,
        .settings-content input[type="range"],
        .settings-content input[type="text"]{
            width:100%;padding:8px;background:var(--bg-elevated-2);border:none;
            border-radius:8px;color:#fff;font-size:13px;
        }
        .settings-content button{
            padding:8px;border-radius:8px;border:none;background:var(--bg-elevated-2);
            color:var(--text-main);cursor:pointer;font-size:13px;
        }
        .settings-content button:hover{background:#3a3a3c}
        .sessions-list{
            margin-top:8px;max-height:160px;overflow-y:auto;border-radius:8px;
            border:1px solid var(--border-subtle);
        }
        .session-item{
            padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border-subtle);
        }
        .session-item:last-child{border-bottom:none}
        .session-item.active{
            background:var(--bg-elevated-2);border-right:3px solid var(--accent);
        }
        .patch-overlay{
            position:fixed;bottom:-100%;left:0;width:100%;height:60%;
            background:var(--bg-elevated);border-top:2px solid var(--border-subtle);
            transition:.35s ease;z-index:200;padding:20px;overflow-y:auto;
        }
        .patch-overlay.active{bottom:0}
        .patch-header{
            display:flex;justify-content:space-between;margin-bottom:15px;align-items:center;
        }
        .patch-header h3{margin:0;font-size:15px}
        .patch-diff{display:flex;gap:20px}
        .patch-diff pre{
            background:var(--bg-main)!important;padding:15px;border-radius:10px;
            width:50%;overflow-x:auto;max-height:260px;
        }
        .patch-diff h4{margin:0 0 6px 0;font-size:13px;color:var(--text-muted)}
        .patch-actions{margin-top:20px;display:flex;gap:10px}
        .patch-actions button{
            flex:1;padding:12px;border:none;border-radius:10px;cursor:pointer;font-size:14px;
        }
        #applyPatchBtn{background:var(--success);color:#000}
        #rejectPatchBtn{background:var(--danger);color:#fff}
        @media(max-width:768px){
            .sidebar{width:100%}
            .patch-diff{flex-direction:column}
            .patch-diff pre{width:100%}
            .message{max-width:90%}
        }
    </style>
</head>
<body>

    <div id="newChatBtn" class="top-new-chat">
        <span>🆕</span><span>New Chat</span>
    </div>

    <div id="openFilesBtn" class="floating-btn left">📁</div>
    <div id="openSettingsBtn" class="floating-btn right">⚙️</div>

    <main id="chatPage" class="page active">
        <div id="chatContainer" class="chat-container"></div>
        <div class="chat-input-bar">
            <input id="chatInput" type="text" placeholder="اكتب رسالتك هنا...">
            <button id="sendMsgBtn">إرسال</button>
        </div>
    </main>

    <aside id="filesSidebar" class="sidebar left">
        <div class="sidebar-header">
            <h3>ملفات المشروع</h3>
            <button id="closeFilesSidebar">✖</button>
        </div>

        <div id="filesList" class="files-list"></div>

        <div class="file-actions">
            <input type="file" id="uploadFileInput">
            <button id="uploadFileBtn">رفع ملف</button>
            <button id="createEmptyFileBtn">إنشاء ملف جديد</button>
            <button id="uploadToGistBtn">رفع المشروع إلى Gist</button>
            <button id="loadFromGistBtn">تحميل Gist إلى المشروع</button>
        </div>

        <div id="fileEditor" class="file-editor">
            <pre><code id="fileEditorCode" class="language-javascript"></code></pre>
        </div>

        <div class="file-editor-actions">
            <button id="sendFileToChat">إرسال للمحادثة</button>
            <button id="saveFileChanges">حفظ التعديلات</button>
            <button id="runJsFile">تشغيل JavaScript</button>
        </div>
    </aside>

    <aside id="settingsSidebar" class="sidebar right">
        <div class="sidebar-header">
            <h3>الإعدادات</h3>
            <button id="closeSettingsSidebar">✖</button>
        </div>

        <div class="settings-content">
            <div>
                <label>مفتاح API (اختياري – تخزين محلي فقط):</label>
                <input id="apiKeyInput" type="text" placeholder="sk-...">
            </div>
            <div>
                <label>نموذج الذكاء الاصطناعي:</label>
                <select id="modelSelect">
                    <option value="dummy">وضع تجريبي (بدون API)</option>
                    <option value="openai">OpenAI Compatible</option>
                </select>
            </div>
            <div>
                <label>لغة البرمجة الافتراضية:</label>
                <select id="languageSelect">
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                    <option value="java">Java</option>
                </select>
            </div>
            <div>
                <label>وضع المساعد:</label>
                <select id="assistantMode">
                    <option value="strict">تحليل صارم للكود</option>
                    <option value="helper">مساعد مرن</option>
                </select>
            </div>
            <div>
                <label>Temperature:</label>
                <input id="tempSlider" type="range" min="0" max="100" value="20">
            </div>
            <div>
                <label>حجم الخط في المحادثة:</label>
                <input id="fontSizeSlider" type="range" min="12" max="22" value="15">
            </div>
            <div>
                <label>الجلسات:</label>
                <button id="newSessionBtn">جلسة جديدة</button>
                <button id="deleteSessionBtn">حذف الجلسة الحالية</button>
                <div class="sessions-list" id="sessionsList"></div>
            </div>
        </div>
    </aside>

    <div id="patchOverlay" class="patch-overlay">
        <div class="patch-header">
            <h3>مراجعة التعديلات على الملف</h3>
            <button id="closePatchOverlay">✖</button>
        </div>
        <div class="patch-diff">
            <div class="patch-old">
                <h4>الملف الأصلي</h4>
                <pre><code id="patchOldCode" class="language-javascript"></code></pre>
            </div>
            <div class="patch-new">
                <h4>التعديل المقترح</h4>
                <pre><code id="patchNewCode" class="language-javascript"></code></pre>
            </div>
        </div>
        <div class="patch-actions">
            <button id="applyPatchBtn">تطبيق التعديل</button>
            <button id="rejectPatchBtn">رفض</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <script>
        class AppState {
            constructor() {
                this.sessions = {};
                this.currentSessionId = null;
                this.files = {};
                this.currentFileName = null;
                this.pendingPatch = null;
                this.settings = {
                    language:'javascript',
                    assistantMode:'strict',
                    temperature:0.2,
                    fontSize:15,
                    apiKey:'',
                    model:'dummy'
                };
            }
        }
        const state = new AppState();
        const $ = id => document.getElementById(id);
        function uuid(){
            return'xxxx-4xxx-yxxx'.replace(/[xy]/g,c=>{
                const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);
                return v.toString(16);
            });
        }

        class ChatManager{
            constructor(container){this.container=container;}
            addMessage(text,type='user'){
                const div=document.createElement('div');
                div.className='message '+type;
                div.textContent=text;
                this.container.appendChild(div);
                this.container.scrollTop=this.container.scrollHeight;
                if(state.currentSessionId){
                    state.sessions[state.currentSessionId].messages.push({text,type,ts:Date.now()});
                    SessionManager.saveSessions();
                }
            }
            addSystem(text){
                const div=document.createElement('div');
                div.className='message system';
                div.textContent=text;
                this.container.appendChild(div);
                this.container.scrollTop=this.container.scrollHeight;
            }
            clear(){this.container.innerHTML='';}
            renderSession(session){
                this.clear();
                session.messages.forEach(m=>this.addMessage(m.text,m.type));
            }
        }

        class FileManager{
            constructor(listEl,editorCodeEl){
                this.listEl=listEl;this.editorCodeEl=editorCodeEl;
            }
            renderList(){
                this.listEl.innerHTML='';
                Object.keys(state.files).forEach(name=>{
                    const item=document.createElement('div');
                    item.className='file-item'+(state.currentFileName===name?' active':'');
                    const span=document.createElement('span');span.textContent=name;
                    const meta=document.createElement('small');
                    meta.textContent=(state.files[name]||'').length+' chars';
                    item.appendChild(span);item.appendChild(meta);
                    item.onclick=()=>this.openFile(name);
                    this.listEl.appendChild(item);
                });
            }
            openFile(name){
                state.currentFileName=name;
                this.editorCodeEl.textContent=state.files[name]||'';
                Prism.highlightElement(this.editorCodeEl);
                this.renderList();
            }
            saveCurrentFromEditor(){
                if(!state.currentFileName)return;
                state.files[state.currentFileName]=this.editorCodeEl.textContent;
                chat.addMessage('تم حفظ التعديلات في الملف: '+state.currentFileName,'ai');
            }
            createEmptyFile(){
                const name=prompt('اسم الملف الجديد (مثال: app.js):');
                if(!name)return;
                if(state.files[name]){alert('يوجد ملف بنفس الاسم.');return;}
                state.files[name]='';this.renderList();this.openFile(name);
            }
            loadFromUpload(file){
                const reader=new FileReader();
                reader.onload=e=>{
                    state.files[file.name]=e.target.result;
                    this.renderList();this.openFile(file.name);
                };
                reader.readAsText(file);
            }
        }

        class PatchManager{
            constructor(overlayEl,oldEl,newEl){
                this.overlayEl=overlayEl;this.oldEl=oldEl;this.newEl=newEl;
            }
            open(oldCode,newCode){
                state.pendingPatch={oldCode,newCode,file:state.currentFileName};
                this.oldEl.textContent=oldCode;
                this.newEl.textContent=newCode;
                Prism.highlightElement(this.oldEl);
                Prism.highlightElement(this.newEl);
                this.overlayEl.classList.add('active');
            }
            close(){this.overlayEl.classList.remove('active');state.pendingPatch=null;}
            apply(){
                if(!state.pendingPatch||!state.pendingPatch.file)return;
                state.files[state.pendingPatch.file]=state.pendingPatch.newCode;
                fileManager.openFile(state.pendingPatch.file);
                this.close();
                chat.addMessage('تم تطبيق التعديل على الملف: '+state.pendingPatch.file,'ai');
            }
            reject(){this.close();chat.addMessage('تم رفض التعديل ✅','ai');}
        }

        class SessionManager{
            constructor(listEl){
                this.listEl=listEl;
                this.loadSessions();
                if(!state.currentSessionId)this.createSession('الجلسة الأولى');
                this.render();
            }
            static saveSessions(){
                try{
                    localStorage.setItem('ai_workspace_sessions',JSON.stringify({
                        sessions:state.sessions,current:state.currentSessionId
                    }));
                }catch(e){}
            }
            loadSessions(){
                try{
                    const raw=localStorage.getItem('ai_workspace_sessions');
                    if(!raw)return;
                    const parsed=JSON.parse(raw);
                    state.sessions=parsed.sessions||{};
                    state.currentSessionId=parsed.current||null;
                }catch(e){}
            }
            createSession(name){
                const id=uuid();
                state.sessions[id]={id,name:name||('جلسة '+Object.keys(state.sessions).length),
                    createdAt:Date.now(),messages:[]};
                state.currentSessionId=id;
                SessionManager.saveSessions();
                this.render();chat.clear();
                chat.addSystem('تم إنشاء جلسة جديدة: '+state.sessions[id].name);
            }
            deleteCurrent(){
                if(!state.currentSessionId)return;
                const id=state.currentSessionId;
                delete state.sessions[id];
                const keys=Object.keys(state.sessions);
                state.currentSessionId=keys[0]||null;
                SessionManager.saveSessions();
                this.render();chat.clear();
                if(state.currentSessionId)chat.renderSession(state.sessions[state.currentSessionId]);
                else chat.addSystem('لا توجد جلسات حالياً.');
            }
            switchTo(id){
                if(!state.sessions[id])return;
                state.currentSessionId=id;
                SessionManager.saveSessions();
                this.render();chat.clear();
                chat.renderSession(state.sessions[id]);
            }
            render(){
                this.listEl.innerHTML='';
                Object.values(state.sessions)
                    .sort((a,b)=>a.createdAt-b.createdAt)
                    .forEach(s=>{
                        const div=document.createElement('div');
                        div.className='session-item'+(s.id===state.currentSessionId?' active':'');
                        div.textContent=s.name;
                        div.onclick=()=>this.switchTo(s.id);
                        this.listEl.appendChild(div);
                    });
            }
        }

        class SettingsManager{
            static load(){
                try{
                    const raw=localStorage.getItem('ai_workspace_settings');
                    if(!raw)return;
                    const parsed=JSON.parse(raw);
                    Object.assign(state.settings,parsed);
                }catch(e){}
            }
            static save(){
                try{
                    localStorage.setItem('ai_workspace_settings',JSON.stringify(state.settings));
                }catch(e){}
            }
            static applyUI(){
                $('languageSelect').value=state.settings.language;
                $('assistantMode').value=state.settings.assistantMode;
                $('tempSlider').value=Math.round(state.settings.temperature*100);
                $('fontSizeSlider').value=state.settings.fontSize;
                $('apiKeyInput').value=state.settings.apiKey||'';
                $('modelSelect').value=state.settings.model;
                document.querySelectorAll('.message').forEach(m=>{
                    m.style.fontSize=state.settings.fontSize+'px';
                });
            }
            static updateFromUI(){
                state.settings.language=$('languageSelect').value;
                state.settings.assistantMode=$('assistantMode').value;
                state.settings.temperature=$('tempSlider').value/100;
                state.settings.fontSize=parseInt($('fontSizeSlider').value,10)||15;
                state.settings.apiKey=$('apiKeyInput').value.trim();
                state.settings.model=$('modelSelect').value;
                SettingsManager.save();
                SettingsManager.applyUI();
            }
        }

        class AIClient{
            static async sendMessage(prompt,context){
                if(state.settings.model==='dummy'||!state.settings.apiKey){
                    return AIClient.fakeReply(prompt,context);
                }
                return AIClient.fakeReply(prompt,context);
            }
            static fakeReply(prompt,context){
                const lower=prompt.toLowerCase();
                if(state.currentFileName&&(lower.includes('عدل')||lower.includes('تعديل'))){
                    const oldCode=state.files[state.currentFileName]||'// ملف فارغ';
                    const newCode=oldCode+'\n// تعديل تجريبي من النموذج';
                    return{
                        text:'اقترحت تعديل على الملف: '+state.currentFileName+
                             '\n\n(تم فتح نافذة مراجعة التعديلات في الأسفل)',
                        patch:{oldCode,newCode}
                    };
                }
                return{
                    text:'رد تجريبي من النموذج على:\n'+prompt+
                         '\n\n(يمكنك ربط هذا الرد مع API حقيقي لاحقاً)'
                };
            }
        }

        class GistManager{
            constructor(token){this.token=token;this.api="https://api.github.com/gists";}
            setToken(token){this.token=token;}
            async createGist(description,filesObj,isPublic=false){
                const body={description,public:isPublic,files:filesObj};
                const res=await fetch(this.api,{
                    method:"POST",
                    headers:{
                        "Authorization":"token "+this.token,
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify(body)
                });
                return await res.json();
            }
            async getGist(gistId){
                const res=await fetch(`${this.api}/${gistId}`,{
                    headers:{"Authorization":"token "+this.token}
                });
                return await res.json();
            }
        }

        const chat=new ChatManager($('chatContainer'));
        const fileManager=new FileManager($('filesList'),$('fileEditorCode'));
        const patchManager=new PatchManager($('patchOverlay'),$('patchOldCode'),$('patchNewCode'));
        let sessionManager;
        let gist=new GistManager("");

        function init(){
            SettingsManager.load();
            SettingsManager.applyUI();
            sessionManager=new SessionManager($('sessionsList'));
            if(!state.currentSessionId)sessionManager.createSession('الجلسة الأولى');
            else chat.renderSession(state.sessions[state.currentSessionId]);
            chat.addSystem('مرحباً 👋 هذا Workspace متقدم شبيه ChatGPT مع دعم الملفات والباتش وGitHub Gist.');

            $('sendMsgBtn').onclick=onSendMessage;
            $('chatInput').addEventListener('keydown',e=>{
                if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();onSendMessage();}
            });

            $('openFilesBtn').onclick=()=>$('filesSidebar').classList.add('active','left');
            $('closeFilesSidebar').onclick=()=>$('filesSidebar').classList.remove('active','left');
            $('openSettingsBtn').onclick=()=>$('settingsSidebar').classList.add('active','right');
            $('closeSettingsSidebar').onclick=()=>$('settingsSidebar').classList.remove('active','right');

            $('newChatBtn').onclick=()=>{
                chat.clear();
                chat.addSystem('تم بدء محادثة جديدة في نفس الجلسة ✅');
                if(state.currentSessionId){
                    state.sessions[state.currentSessionId].messages=[];
                    SessionManager.saveSessions();
                }
            };

            $('uploadFileBtn').onclick=()=>{
                const file=$('uploadFileInput').files[0];
                if(!file)return;
                fileManager.loadFromUpload(file);
            };
            $('createEmptyFileBtn').onclick=()=>fileManager.createEmptyFile();
            $('saveFileChanges').onclick=()=>fileManager.saveCurrentFromEditor();
            $('sendFileToChat').onclick=()=>{
                if(!state.currentFileName)return;
                chat.addMessage('محتوى الملف "'+state.currentFileName+'":\n\n'+state.files[state.currentFileName],'user');
            };
            $('runJsFile').onclick=()=>{
                if(!state.currentFileName)return;
                try{
                    eval(state.files[state.currentFileName]);
                    chat.addMessage('تم تشغيل ملف JavaScript بنجاح: '+state.currentFileName,'ai');
                }catch(e){
                    chat.addMessage('خطأ أثناء تشغيل الملف:\n'+e.message,'ai');
                }
            };

            $('closePatchOverlay').onclick=()=>patchManager.close();
            $('rejectPatchBtn').onclick=()=>patchManager.reject();
            $('applyPatchBtn').onclick=()=>patchManager.apply();

            $('languageSelect').onchange=
            $('assistantMode').onchange=
            $('tempSlider').oninput=
            $('fontSizeSlider').oninput=
            $('apiKeyInput').onchange=
            $('modelSelect').onchange=()=>SettingsManager.updateFromUI();

            $('newSessionBtn').onclick=()=>{
                const name=prompt('اسم الجلسة الجديدة:');
                sessionManager.createSession(name||'جلسة جديدة');
            };
            $('deleteSessionBtn').onclick=()=>{
                if(confirm('هل أنت متأكد من حذف الجلسة الحالية؟')){
                    sessionManager.deleteCurrent();
                }
            };

            $('uploadToGistBtn').onclick=async()=>{
                const token=prompt("أدخل GitHub Token:");
                if(!token)return;
                gist.setToken(token);
                const filesObj={};
                for(const name in state.files){
                    filesObj[name]={content:state.files[name]};
                }
                const res=await gist.createGist("AI Workspace Project",filesObj,false);
                if(res.html_url)chat.addMessage("تم رفع المشروع إلى Gist:\n"+res.html_url,"ai");
                else chat.addMessage("حدث خطأ أثناء رفع المشروع.","ai");
            };

            $('loadFromGistBtn').onclick=async()=>{
                const token=prompt("أدخل GitHub Token:");
                if(!token)return;
                const gistId=prompt("أدخل Gist ID:");
                if(!gistId)return;
                gist.setToken(token);
                const res=await gist.getGist(gistId);
                if(!res.files){chat.addMessage("تعذر تحميل Gist.","ai");return;}
                state.files={};
                for(const name in res.files){
                    state.files[name]=res.files[name].content;
                }
                fileManager.renderList();
                chat.addMessage("تم تحميل ملفات Gist بنجاح.","ai");
            };
        }

        async function onSendMessage(){
            const input=$('chatInput');
            const text=input.value.trim();
            if(!text)return;
            chat.addMessage(text,'user');
            input.value='';
            const context={
                fileName:state.currentFileName,
                language:state.settings.language,
                assistantMode:state.settings.assistantMode
            };
            const res=await AIClient.sendMessage(text,context);
            chat.addMessage(res.text,'ai');
            if(res.patch&&state.currentFileName){
                patchManager.open(res.patch.oldCode,res.patch.newCode);
            }
        }

        window.addEventListener('load',init);
    </script>
</body>
</html>
