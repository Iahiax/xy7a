<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Web VS Code + Mistral Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      --bg-main:#1e1e1e;
      --bg-sidebar:#252526;
      --bg-editor:#1e1e1e;
      --bg-panel:#202020;
      --bg-chat:#1f2430;
      --border:#333;
      --accent:#007acc;
      --text:#f3f3f3;
      --text-muted:#9e9e9e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg-main);
      color:var(--text);
      height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* Title bar */
    .titlebar{
      height:28px;
      background:#3c3c3c;
      display:flex;
      align-items:center;
      padding:0 10px;
      font-size:12px;
      color:var(--text-muted);
      justify-content:space-between;
    }
    .titlebar-right{
      display:flex;
      gap:6px;
    }
    .titlebar-btn{
      width:12px;height:12px;border-radius:50%;
    }
    .tb-red{background:#ff5f57}
    .tb-yellow{background:#febc2e}
    .tb-green{background:#28c840}

    /* Menu bar */
    .menubar{
      height:24px;
      background:#2d2d2d;
      display:flex;
      align-items:center;
      padding:0 10px;
      font-size:12px;
      color:var(--text-muted);
      gap:12px;
    }

    /* Layout */
    .main{
      flex:1;
      display:flex;
      overflow:hidden;
    }

    /* Activity bar */
    .activitybar{
      width:40px;
      background:#333333;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top:8px;
      gap:10px;
      font-size:18px;
    }
    .activity-icon{
      cursor:pointer;
      opacity:.7;
    }
    .activity-icon.active,
    .activity-icon:hover{
      opacity:1;
      color:var(--accent);
    }

    /* Sidebar */
    .sidebar{
      width:240px;
      background:var(--bg-sidebar);
      border-inline-end:1px solid var(--border);
      display:flex;
      flex-direction:column;
    }
    .sidebar-header{
      padding:6px 10px;
      font-size:11px;
      text-transform:uppercase;
      color:var(--text-muted);
      border-bottom:1px solid var(--border);
    }
    .files-list{
      flex:1;
      overflow-y:auto;
      font-size:12px;
      padding:4px 0;
    }
    .file-item{
      padding:4px 10px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .file-item:hover{
      background:#2a2d2e;
    }
    .file-item.active{
      background:#094771;
      color:#fff;
    }
    .sidebar-footer{
      padding:6px 8px;
      border-top:1px solid var(--border);
      font-size:11px;
      color:var(--text-muted);
    }
    .sidebar-footer button{
      width:100%;
      padding:4px 6px;
      font-size:11px;
      background:#0e639c;
      border:none;
      border-radius:3px;
      color:#fff;
      cursor:pointer;
    }

    /* Center editor */
    .center{
      flex:1;
      display:flex;
      flex-direction:column;
      background:var(--bg-editor);
    }
    .tabs{
      height:28px;
      display:flex;
      background:#252526;
      border-bottom:1px solid var(--border);
      font-size:12px;
    }
    .tab{
      padding:0 12px;
      display:flex;
      align-items:center;
      cursor:pointer;
      color:var(--text-muted);
      border-inline-end:1px solid #2d2d2d;
    }
    .tab.active{
      background:#1e1e1e;
      color:var(--text);
      border-bottom:2px solid var(--accent);
    }
    .editor{
      flex:1;
      display:flex;
    }
    .gutter{
      width:40px;
      background:#252526;
      color:var(--text-muted);
      font-family:Consolas,monospace;
      font-size:12px;
      padding:10px 4px;
      text-align:right;
      user-select:none;
    }
    .editor textarea{
      flex:1;
      background:var(--bg-editor);
      color:var(--text);
      border:none;
      padding:10px;
      font-family:Consolas,monospace;
      font-size:13px;
      resize:none;
      outline:none;
      direction:ltr;
      text-align:left;
      line-height:1.5;
    }

    /* Chat panel */
    .right-panel{
      width:320px;
      background:var(--bg-chat);
      border-inline-start:1px solid var(--border);
      display:flex;
      flex-direction:column;
    }
    .right-header{
      padding:6px 10px;
      font-size:11px;
      text-transform:uppercase;
      color:var(--text-muted);
      border-bottom:1px solid var(--border);
    }
    .chat-container{
      flex:1;
      overflow-y:auto;
      padding:10px;
      font-size:12px;
    }
    .msg{
      margin-bottom:8px;
      line-height:1.5;
      white-space:pre-wrap;
    }
    .msg.user{color:#c5e1ff}
    .msg.ai{color:#e5e5e5}
    .msg.system{color:var(--text-muted);font-size:11px;text-align:center}

    .copy-btn{
      display:inline-block;
      margin-top:2px;
      padding:2px 6px;
      font-size:10px;
      border-radius:3px;
      border:none;
      background:#2d2f3a;
      color:#fff;
      cursor:pointer;
    }

    .chat-input{
      border-top:1px solid var(--border);
      padding:6px;
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .chat-input textarea{
      width:100%;
      resize:none;
      border:none;
      border-radius:3px;
      padding:6px;
      font-size:12px;
      background:#151822;
      color:#fff;
      outline:none;
    }
    .chat-input button{
      align-self:flex-end;
      padding:4px 10px;
      font-size:11px;
      border:none;
      border-radius:3px;
      background:var(--accent);
      color:#fff;
      cursor:pointer;
    }

    /* Status bar */
    .statusbar{
      height:22px;
      background:#007acc;
      color:#fff;
      font-size:11px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 10px;
    }
  </style>
</head>
<body>

  <!-- Title bar -->
  <div class="titlebar">
    <div>Web VS Code – Mistral</div>
    <div class="titlebar-right">
      <div class="titlebar-btn tb-red"></div>
      <div class="titlebar-btn tb-yellow"></div>
      <div class="titlebar-btn tb-green"></div>
    </div>
  </div>

  <!-- Menu bar -->
  <div class="menubar">
    <span>File</span><span>Edit</span><span>View</span><span>Run</span><span>Help</span>
  </div>

  <!-- Main layout -->
  <div class="main">

    <!-- Activity bar -->
    <div class="activitybar">
      <div class="activity-icon active">📁</div>
      <div class="activity-icon">🔍</div>
      <div class="activity-icon">🐛</div>
      <div class="activity-icon">⚙️</div>
    </div>

    <!-- Explorer -->
    <aside class="sidebar">
      <div class="sidebar-header">Explorer</div>
      <div id="filesList" class="files-list"></div>
      <div class="sidebar-footer">
        <button id="newFileBtn">+ New File</button>
      </div>
    </aside>

    <!-- Editor -->
    <div class="center">
      <div id="tabs" class="tabs"></div>
      <div class="editor">
        <div id="gutter" class="gutter"></div>
        <textarea id="editor"></textarea>
      </div>
    </div>

    <!-- Chat -->
    <aside class="right-panel">
      <div class="right-header">Mistral Assistant</div>
      <div id="chat" class="chat-container">
        <div class="msg system">اسأل عن الكود أو اطلب تعديلات…</div>
      </div>
      <div class="chat-input">
        <textarea id="chatInput" rows="2" placeholder="اكتب سؤالك..."></textarea>
        <button id="sendChatBtn">إرسال</button>
      </div>
    </aside>

  </div>

  <!-- Status bar -->
  <div class="statusbar">
    <span id="statusFile">No file</span>
    <span>UTF-8</span>
  </div>

<script>
  // 🔥 مفتاح Mistral API
  const MISTRAL_API_KEY = "fkU26zoB0QlbqfaV79jKfm098kO4EJcy";

  const files = {
    "index.html": "<h1>Hello</h1>",
    "main.js": "console.log('Hello');",
    "style.css": "body{background:#111;color:#fff}"
  };
  let currentFile = null;

  const filesListEl = document.getElementById('filesList');
  const tabsEl = document.getElementById('tabs');
  const editorEl = document.getElementById('editor');
  const gutterEl = document.getElementById('gutter');
  const statusFileEl = document.getElementById('statusFile');

  const chatEl = document.getElementById('chat');
  const chatInputEl = document.getElementById('chatInput');
  const sendChatBtn = document.getElementById('sendChatBtn');

  function renderFiles(){
    filesListEl.innerHTML = '';
    Object.keys(files).forEach(name=>{
      const item = document.createElement('div');
      item.className = 'file-item' + (name===currentFile?' active':'');
      item.innerHTML = `<span>📄</span><span>${name}</span>`;
      item.onclick = ()=>openFile(name);
      filesListEl.appendChild(item);
    });
  }

  function renderTabs(){
    tabsEl.innerHTML = '';
    Object.keys(files).forEach(name=>{
      const tab = document.createElement('div');
      tab.className = 'tab' + (name===currentFile?' active':'');
      tab.textContent = name;
      tab.onclick = ()=>openFile(name);
      tabsEl.appendChild(tab);
    });
  }

  function updateGutter(){
    const lines = editorEl.value.split('\n').length;
    gutterEl.textContent = Array.from({length:lines},(_,i)=>i+1).join('\n');
  }

  function openFile(name){
    if(currentFile){
      files[currentFile] = editorEl.value;
    }
    currentFile = name;
    editorEl.value = files[name];
    statusFileEl.textContent = name;
    renderFiles();
    renderTabs();
    updateGutter();
  }

  editorEl.addEventListener('input', updateGutter);

  // Chat
  function addChatMessage(text,type){
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.textContent = text;

    if(type==='ai'){
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'نسخ';
      btn.onclick = ()=>{
        navigator.clipboard.writeText(text);
        btn.textContent = '✓';
        setTimeout(()=>btn.textContent='نسخ',1000);
      };
      div.appendChild(document.createElement('br'));
      div.appendChild(btn);
    }

    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  async function callMistral(prompt){
    const messages = [
      {role:"system",content:"You are a coding assistant inside a VS Code-like IDE."}
    ];

    if(currentFile){
      messages.push({
        role:"user",
        content:`Current file: ${currentFile}\nContent:\n${files[currentFile]}`
      });
    }

    messages.push({role:"user",content:prompt});

    const res = await fetch("https://api.mistral.ai/v1/chat/completions",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+MISTRAL_API_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        model:"mistral-large-latest",
        messages
      })
    });

    const data = await res.json();
    return data.choices[0].message.content;
  }

  async function sendChat(){
    const text = chatInputEl.value.trim();
    if(!text) return;

    addChatMessage(text,'user');
    chatInputEl.value = '';
    sendChatBtn.disabled = true;

    try{
      const reply = await callMistral(text);
      addChatMessage(reply,'ai');
    }catch(e){
      addChatMessage("⚠️ خطأ أثناء الاتصال بـ Mistral","system");
    }

    sendChatBtn.disabled = false;
  }

  // إصلاح زر الإرسال
  sendChatBtn.addEventListener("click", sendChat);

  // إصلاح Enter
  chatInputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendChat();
    }
  });

  // Init
  renderFiles();
  renderTabs();
  openFile("index.html");
</script>

</body>
</html>
